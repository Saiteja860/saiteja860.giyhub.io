<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Saiteja Gajula</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F59E0B'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='30' font-weight='bold' fill='%2317172B' text-anchor='middle'%3ESG%3C/text%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F6F6F3;
      color: #17172B;
      font-family: 'Inter', system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(5rem, 20vw, 10rem);
      line-height: 1;
      background: linear-gradient(120deg, #17172B 60%, #E11D48);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 1.5rem; margin: 1rem 0 0.5rem; }
    p { color: #5B5B70; margin-bottom: 2rem; }
    .btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 0.85rem 1.6rem;
      border-radius: 100px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.98rem;
    }
    .primary { background: #F59E0B; color: #1a1330; }
    .ghost { border: 1px solid rgba(23,23,43,0.18); color: #17172B; }
    a:hover { transform: translateY(-2px); transition: transform 0.2s ease; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link may be broken, or the page has moved. Let's get you back.</p>
    <div class="btns">
      <a class="primary" href="index.html">Back to home</a>
      <a class="ghost" href="index.html#work">See my work</a>
    </div>
  </main>
</body>
</html>
